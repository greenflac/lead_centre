name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" fastapi uvicorn httpx
      # Сеть в тестах запрещена машиной: ci/sitecustomize.py подхватывается через PYTHONPATH.
      - run: make test-ci-selfcheck
      - run: make test-ci
      - run: python -m ruff check leadcentre tests
