name: ci
on: [push, pull_request]

# Сборка только читает код и гоняет проверки: ничего не публикует, не пишет в репозиторий
# и не трогает issue. Токену по умолчанию GitHub даёт больше — сужаем до чтения (А1).
permissions:
  contents: read

# Два пуша подряд в одну ветку не гоняются наперегонки: свежий отменяет предыдущий (А4).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Сеть в тестах запрещена машиной: ci/sitecustomize.py подхватывается через PYTHONPATH.
      - run: make test-ci-selfcheck
      - run: make test-ci
      - run: make lint
      # Сквозная проверка обещания из первого абзаца README: четыре обращения, 32 проверки.
      - run: make demo

  web:
    # Приборы дашборда — такой же гейт, как тесты: контраст, свойства дизайн-системы и
    # сверка порта на TypeScript с движком на Python. Без этой работы копия правил в порте
    # расходится с оригиналом молча — так уже было.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: web
      - run: make check-web
      - run: npm run build
        working-directory: web
