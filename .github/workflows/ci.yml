name: ci
on: [push, pull_request]

# The build only reads code and runs checks, so the token is narrowed to read.
permissions:
  contents: read

# A newer push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # The network ban is enforced by ci/sitecustomize.py, loaded via PYTHONPATH.
      - run: make test-ci-selfcheck
      - run: make test-ci
      - run: make lint
      # End-to-end check of the promise the README opens with.
      - run: make demo

  web:
    # Dashboard instruments gate the build like tests do; without the crosscheck the
    # TypeScript port drifts from the Python engine silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: web
      - run: make check-web
      - run: npm run build
        working-directory: web
