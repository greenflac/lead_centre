# Демонстрационный прайс-лист.
#
# Это НЕ прайс заказчика. Числа — публичные рыночные диапазоны Дубая 2025-2026 из
# открытых источников плюс значения, назначенные автором для демонстрации. При внедрении
# файл заменяется выгрузкой из CRM или прайсом компании; формат остаётся тот же.
#
# Происхождение каждого числа указано полем `origin`:
#   рынок  — диапазон из открытых источников; первоисточник по каждому числу не
#            перепроверялся, поэтому в продукт эти цифры идти не могут;
#   выбрано — назначено автором для демонстрации, замера под ним нет.
#
# Формат: диапазон min/max в AED. Точечных цен в файле нет намеренно — генератор
# черновиков не имеет права назвать клиенту точную цифру.

